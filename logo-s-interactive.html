<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S Logo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f14;
    font-family: Arial, Helvetica, sans-serif;
  }

  .logo-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    cursor: pointer;
  }

  /* Rotating gradient halo behind the circle */
  .halo {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #FF6B6B, #F72585, #7209B7, #4361EE, #4CC9F0, #FF6B6B);
    filter: blur(6px);
    opacity: 0.55;
    animation: spin 6s linear infinite;
    transition: opacity 0.4s ease, filter 0.4s ease;
  }

  .logo-wrap:hover .halo {
    opacity: 0.9;
    filter: blur(10px);
    animation-duration: 2.5s;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF6B6B 0%, #F72585 35%, #7209B7 65%, #4361EE 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(1) rotate(0deg);
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), box-shadow 0.4s ease;
    overflow: hidden;
  }

  .logo-wrap:hover .circle {
    transform: scale(1.08) rotate(-6deg);
    box-shadow: 0 18px 45px rgba(114, 9, 183, 0.45);
  }

  /* Soft sheen sweep on hover */
  .circle::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -60%;
    width: 60%;
    height: 200%;
    background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(20deg);
    transition: left 0.7s ease;
  }

  .logo-wrap:hover .circle::before {
    left: 130%;
  }

  .letter {
    font-size: 140px;
    font-weight: 800;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFF3B0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    transform: translateY(6px);
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), filter 0.4s ease;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }

  .logo-wrap:hover .letter {
    transform: translateY(0px) scale(1.05);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }
</style>
</head>
<body>

  <div class="logo-wrap">
    <div class="halo"></div>
    <div class="circle">
      <div class="letter">S</div>
    </div>
  </div>

</body>
</html>
