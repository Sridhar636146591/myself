<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" fill="none">
  <defs>
    <!-- Gradient for the main circle -->
    <linearGradient id="circleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="35%" stop-color="#F72585" />
      <stop offset="65%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#4361EE" />
    </linearGradient>
    
    <!-- Gradient for the letter S -->
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF3B0" />
    </linearGradient>

    <!-- Multi-stop radial gradient to simulate the colorful halo -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#F72585" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#7209B7" stop-opacity="0.6" />
      <stop offset="90%" stop-color="#4CC9F0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0" />
    </radialGradient>

    <!-- Blur filter for the glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Glowing Halo (Behind) -->
  <circle cx="130" cy="130" r="128" fill="url(#haloGrad)" filter="url(#glow)" />

  <!-- Main Circle (Enlarged slightly from r=110 to r=120) -->
  <circle cx="130" cy="130" r="120" fill="url(#circleGrad)" />

  <!-- Letter S (Enlarged from font-size=145 to font-size=175) -->
  <text x="130" y="136" font-family="Arial, Helvetica, sans-serif" font-size="175" font-weight="900" text-anchor="middle" dominant-baseline="central" fill="url(#letterGrad)" filter="drop-shadow(0px 5px 7px rgba(0,0,0,0.4))">S</text>
</svg>